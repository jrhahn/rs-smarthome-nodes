[target.riscv32imc-unknown-none-elf]
# The partition table is part of every flash from here on: without it espflash
# writes its default single-app table, which has no second slot and no otadata,
# and the board silently loses the ability to update itself. See docs/ota.md.
runner = "espflash flash --monitor --partition-table partitions.csv"

rustflags = [
    # esp-hal's `linkall.x` pulls in every sub-script (memory map, ROM
    # functions, RTC sections, ...) needed to link an ESP32-C3 image.
    "-C", "link-arg=-Tlinkall.x",
]

[build]
target = "riscv32imc-unknown-none-elf"

[env]
# Compile-time Wi-Fi / MQTT credentials. Override on the command line:
#   SSID=MyNet PASSWORD=secret cargo run --release
ESP_LOG = "info"
