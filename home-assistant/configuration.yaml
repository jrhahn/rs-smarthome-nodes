# Home Assistant MQTT sensor for the rs-bird-scale.
#
# The firmware publishes the *raw* 24-bit HX711 reading (a signed integer) to
# `birds/scale/state`. All calibration is done here so it can be tuned without
# reflashing the MCU.
#
# Calibration procedure:
#   1. With the pan empty, note the steady raw value -> that is `offset`.
#   2. Place a known mass (e.g. 100 g), note the new raw value.
#   3. scale_factor = (raw_loaded - offset) / mass_in_grams
#
# Merge this into your existing `configuration.yaml`. This uses the modern
# `mqtt:` platform format (the legacy `sensor: - platform: mqtt` style was
# removed in Home Assistant 2022.6). The device does not use MQTT discovery,
# so this manual entry is what makes it appear as an entity; `unique_id` lets
# you rename it / assign an area from the UI.

mqtt:
  sensor:
    - name: "Meisenknödel Gewicht"
      unique_id: birdscale_weight
      state_topic: "birds/scale/state"
      unit_of_measurement: "g"
      device_class: weight
      state_class: measurement
      value_template: >
        {% set raw = value | int %}
        {% set offset = 8388608 %}     {# raw tare offset (empty pan) #}
        {% set scale_factor = 420.0 %} {# raw ticks per gram          #}
        {{ ((raw - offset) / scale_factor) | round(1) }}
