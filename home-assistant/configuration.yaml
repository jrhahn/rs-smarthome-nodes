# Home Assistant entities for the rs-bird-scale.
#
# The firmware now converts the load-cell reading to grams **on-device** using
# calibration stored in flash, so `birds/scale/state` carries a ready-to-use
# gram value (no template maths here anymore). Temperature is published in °C.
#
# Calibration and tuning are done from Home Assistant: the `number`/`button`
# entities below publish **retained** values to `birds/scale/config/<key>`, and
# the device reads them the next time it is online for a publish (i.e. while a
# bird is on / has just left the scale), then persists them to flash. Changes
# therefore take effect with a short delay, not instantly.
#
# Merge this into your existing `configuration.yaml`.

mqtt:
  sensor:
    - name: "Meisenknödel Gewicht"
      unique_id: birdscale_weight
      state_topic: "birds/scale/state"
      unit_of_measurement: "g"
      device_class: weight
      state_class: measurement

    - name: "Meisenknödel Temperatur"
      unique_id: birdscale_temperature
      state_topic: "birds/scale/temperature"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement

  # --- Calibration & tuning (retained -> stored on the controller) ----------
  # These are "optimistic" (no state_topic): HA shows the last value you set.
  number:
    - name: "Meisenknödel Auslöseschwelle"
      unique_id: birdscale_threshold
      command_topic: "birds/scale/config/threshold"
      unit_of_measurement: "g"
      min: 0
      max: 500
      step: 1
      mode: box
      retain: true

    - name: "Meisenknödel Kalibrierfaktor"
      unique_id: birdscale_scale_factor
      command_topic: "birds/scale/config/scale_factor"
      min: 1
      max: 100000
      step: 0.1
      mode: box
      retain: true

    - name: "Meisenknödel Tara-Offset"
      unique_id: birdscale_offset
      command_topic: "birds/scale/config/offset"
      min: -8388608
      max: 8388607
      step: 1
      mode: box
      retain: true

    - name: "Meisenknödel Idle-Intervall"
      unique_id: birdscale_idle_interval
      command_topic: "birds/scale/config/idle_interval"
      unit_of_measurement: "s"
      min: 1
      max: 3600
      step: 1
      mode: box
      retain: true

    - name: "Meisenknödel Aktiv-Intervall"
      unique_id: birdscale_active_interval
      command_topic: "birds/scale/config/active_interval"
      unit_of_measurement: "s"
      min: 1
      max: 3600
      step: 1
      mode: box
      retain: true

    # How often to publish temperature + weight even without a visitor, so HA
    # keeps a fresh reading. Realised as a whole number of idle intervals.
    - name: "Meisenknödel Heartbeat-Intervall"
      unique_id: birdscale_heartbeat_interval
      command_topic: "birds/scale/config/heartbeat_interval"
      unit_of_measurement: "s"
      min: 10
      max: 86400
      step: 10
      mode: box
      retain: true

  # Deep sleep switch. OFF keeps the device awake with Wi-Fi up (bench testing
  # on USB — the serial monitor stays connected and readings stream live). ON is
  # the normal battery behaviour. Takes effect on the device's next online cycle.
  switch:
    - name: "Meisenknödel Deep Sleep"
      unique_id: birdscale_deep_sleep
      command_topic: "birds/scale/config/deep_sleep"
      payload_on: "1"
      payload_off: "0"
      retain: true

# --- Tare button ------------------------------------------------------------
# The device re-zeros by adopting a *new* token published to
# `birds/scale/config/tare`, so each press must publish a fresh value. An MQTT
# button's payload is static, so drive the tare from an automation that
# publishes the current timestamp (retained). Add a Lovelace button that calls
# this script, or press it from Developer Tools.
script:
  birdscale_tare:
    alias: "Meisenknödel tarieren"
    sequence:
      - service: mqtt.publish
        data:
          topic: "birds/scale/config/tare"
          retain: true
          payload: "{{ now().timestamp() | int }}"

# The tare adopts the current empty-house baseline as the new zero, so trigger
# it while the pan is empty. It only takes effect on the device's next online
# cycle (next bird visit / publish).
