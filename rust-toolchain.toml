[toolchain]
# What the esp-hal 1.1 set needs (#32): esp-rom-sys 0.1.5 and
# esp-metadata-generated ask for 1.95, smoltcp 0.13 for 1.91. The 1.83 pin this
# replaces existed only because esp-wifi 0.11's pre-generated bindings broke on
# the `c_char` change in 1.84; esp-radio's do not.
channel = "1.95.0"
components = ["rust-src", "rustfmt", "clippy"]
targets = ["riscv32imc-unknown-none-elf"]
