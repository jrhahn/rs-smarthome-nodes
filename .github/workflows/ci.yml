name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Deliberately *not* setting RUSTFLAGS here: a RUSTFLAGS env var replaces the
  # `target.*.rustflags` in .cargo/config.toml wholesale, which would drop
  # `-C link-arg=-Tlinkall.x` and break the firmware link. Warnings are denied
  # per clippy invocation instead.

jobs:
  # Formatting and the host-testable logic. Fast, and the only job that can
  # actually *run* anything — see `src/lib.rs` for why the firmware itself
  # cannot be tested here.
  test:
    name: Format & host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # rust-toolchain.toml pins the channel (1.83, the last one esp-wifi 0.11
      # builds against) and the components.
      - name: Install Rust
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          key: host

      - name: Format
        run: cargo fmt --all --check

      # The pure subset: no esp-hal, so it builds and runs for the host.
      - name: Clippy (host)
        run: >
          cargo clippy --all-targets --no-default-features --features host-tests
          --target x86_64-unknown-linux-gnu -- -D warnings

      - name: Tests
        run: >
          cargo test --no-default-features --features host-tests
          --target x86_64-unknown-linux-gnu

  # The real thing: every node in the fleet has to build, because `NODE=` picks
  # a different sensor set and power profile at compile time and a node nobody
  # has flashed lately is exactly where a break hides.
  firmware:
    name: Firmware (NODE=${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [schlafzimmer, wohnzimmer, kueche, bad, terrasse]
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          key: firmware

      - name: Clippy
        run: cargo clippy --lib --bins -- -D warnings
        env:
          NODE: ${{ matrix.node }}

      - name: Build
        run: cargo build --release
        env:
          # Credentials and the broker address are compile-time; CI has none and
          # builds against the placeholder defaults. The image is never flashed
          # from here, so that is fine.
          NODE: ${{ matrix.node }}

      - name: Report size
        run: ls -l target/riscv32imc-unknown-none-elf/release/rs-smarthome-nodes

  # The enclosure CAD. Nothing used to run models.py here at all, so a tracked
  # model could drift from the source that produced it and nothing said so --
  # which is exactly what `terrasse_floor.stl` had been doing since 2026-09-18.
  #
  # **STEPs only, and that is the whole design of this job.** A STEP is exact
  # geometry and has been byte-identical across every environment this repo has
  # been exported from. An STL is a mesh, and its triangulation is a tie that
  # different OpenCASCADE builds break differently -- same points, same count,
  # different diagonals. Diffing meshes here would pin the repo to whichever
  # machine GitHub happens to run, and would fail for a part that is correct.
  # See `_export` in models.py for the measurements behind that.
  models:
    name: Enclosure STEPs match models.py
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # OCP is a manylinux wheel with a real OpenCASCADE inside; it wants the
      # GL and X libraries even though nothing here opens a window.
      - name: System libraries for OpenCASCADE
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1 libglu1-mesa libxrender1 libxext6

      # The same pins flake.nix installs into the `cad` shell's venv. Exact,
      # because CadQuery moves its API between minor releases and a different
      # OpenCASCADE writes a different STEP.
      - name: Install CadQuery
        run: pip install --quiet 'cadquery==2.8.0' 'cadquery-ocp==7.9.3.1.1' 'numpy>=2.0'

      - name: Regenerate the models
        run: python models.py

      - name: STEPs must match what models.py produces
        run: |
          # Covers modified, deleted and newly appeared parts alike; the STL
          # churn this deliberately ignores never reaches the filter.
          dirty=$(git status --porcelain -- cad-models | grep '\.step$' || true)
          if [ -n "$dirty" ]; then
            echo "::error::cad-models/*.step do not match models.py — re-run it and commit the result"
            echo "$dirty"
            git diff --stat -- '*.step'
            exit 1
          fi
          echo "all STEPs match models.py"

  # A typo in `NODE=` must fail the build rather than quietly produce an image
  # for the wrong room. That guard is a const-eval panic, so the only way to
  # check it still works is to try.
  unknown-node-fails:
    name: An unknown NODE fails the build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          key: firmware

      - name: Build with a mistyped node name
        run: |
          if NODE=kuche cargo build --release 2>build.log; then
            echo "::error::NODE=kuche built successfully; the const-eval guard is gone"
            exit 1
          fi
          grep -q "unknown NODE" build.log || {
            echo "::error::build failed, but not on the node-name guard:"
            cat build.log
            exit 1
          }
          echo "rejected as expected"
