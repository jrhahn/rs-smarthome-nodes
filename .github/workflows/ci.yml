name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Deliberately *not* setting RUSTFLAGS here: a RUSTFLAGS env var replaces the
  # `target.*.rustflags` in .cargo/config.toml wholesale, which would drop
  # `-C link-arg=-Tlinkall.x` and break the firmware link. Warnings are denied
  # per clippy invocation instead.

jobs:
  # Formatting and the host-testable logic. Fast, and the only job that can
  # actually *run* anything — see `src/lib.rs` for why the firmware itself
  # cannot be tested here.
  test:
    name: Format & host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # rust-toolchain.toml pins the channel (1.83, the last one esp-wifi 0.11
      # builds against) and the components.
      - name: Install Rust
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          key: host

      - name: Format
        run: cargo fmt --all --check

      # The pure subset: no esp-hal, so it builds and runs for the host.
      - name: Clippy (host)
        run: >
          cargo clippy --all-targets --no-default-features --features host-tests
          --target x86_64-unknown-linux-gnu -- -D warnings

      - name: Tests
        run: >
          cargo test --no-default-features --features host-tests
          --target x86_64-unknown-linux-gnu

  # The real thing: every flavor has to build, because `FLAVOR=` picks a
  # different sensor set and power profile at compile time and a flavor nobody
  # has flashed lately is exactly where a break hides. Which board runs which
  # flavor is the deployment's business and not known here.
  firmware:
    name: Firmware (FLAVOR=${{ matrix.flavor }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [climate, climate-co2, air-quality, bird-scale, solar-lamp]
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          key: firmware

      - name: Clippy
        run: cargo clippy --lib --bins -- -D warnings
        env:
          FLAVOR: ${{ matrix.flavor }}

      - name: Build
        run: cargo build --release
        env:
          # Credentials and the broker address are compile-time; CI has none and
          # builds against the placeholder defaults. The image is never flashed
          # from here, so that is fine.
          FLAVOR: ${{ matrix.flavor }}

      - name: Report size
        run: ls -l target/riscv32imc-unknown-none-elf/release/rs-smarthome-nodes

  # A typo in `FLAVOR=`, a malformed `NODE_ID=` and the retired `NODE=` must
  # each fail the build rather than quietly produce an image for the wrong
  # hardware or under the wrong topics. The first two are const-eval panics and
  # the third a build-script panic, so the only way to check they still work
  # is to try.
  unknown-node-fails:
    name: A bad FLAVOR, NODE_ID or NODE fails the build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          key: firmware

      - name: Build with each of the three mistakes
        run: |
          check() {
            if env "$1" cargo build --release 2>build.log; then
              echo "::error::$1 built successfully; the guard is gone"
              exit 1
            fi
            grep -q "$2" build.log || {
              echo "::error::$1 failed, but not on its guard:"
              cat build.log
              exit 1
            }
            echo "$1 rejected as expected"
          }
          check FLAVOR=climat "unknown FLAVOR"
          check NODE_ID=Kitchen "NODE_ID must"
          check NODE=kitchen "NODE=kitchen is gone"
