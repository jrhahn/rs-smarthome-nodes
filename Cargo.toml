[package]
name = "rs-smarthome-nodes"
version = "0.1.0"
edition = "2021"
authors = ["Jürgen Hahn"]
description = "Async no_std firmware for configurable ESP32-C3 smart-home sensor nodes (Embassy); started as a battery bird-feeder scale"
license = "MIT"

[[bin]]
name = "rs-smarthome-nodes"
path = "src/main.rs"

[dependencies]
# --- ESP32-C3 HAL & async runtime ---
esp-hal = { version = "0.22.0", features = ["esp32c3"] }
esp-hal-embassy = { version = "0.5.0", features = ["esp32c3"] }
esp-backtrace = { version = "0.14.2", features = [
    "esp32c3",
    "panic-handler",
    "println",
    "exception-handler",
] }
esp-println = { version = "0.12.0", features = ["esp32c3", "log"] }
esp-alloc = "0.5.0"

# --- Wi-Fi + TCP/IP stack ---
esp-wifi = { version = "0.11.0", features = [
    "esp32c3",
    "wifi",
    "utils",
    "esp-alloc",
] }
embassy-net = { version = "0.4.0", features = [
    "tcp",
    "udp",
    "dhcpv4",
    "medium-ethernet",
    "dns",
] }

# --- Embassy core ---
embassy-executor = { version = "0.6.3", features = [
    "task-arena-size-32768",
    "integrated-timers",
] }
embassy-time = "0.3.2"
embassy-sync = "0.6.1"

# --- MQTT & utility ---
rust-mqtt = { version = "=0.3.0", default-features = false }
static_cell = "2.1.0"
heapless = "0.8.0"
log = "0.4.22"

# --- Config persistence (NVS flash) ---
esp-storage = { version = "0.4.0", features = ["esp32c3"] }
embedded-storage = "0.3"

[profile.dev]
# Rust debug builds are far too large/slow to run on-device; always optimise.
opt-level = 3
lto = "off"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
overflow-checks = false
