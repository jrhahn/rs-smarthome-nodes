[package]
name = "rs-smarthome-nodes"
version = "0.1.0"
edition = "2021"
authors = ["Jürgen Hahn"]
description = "Async no_std firmware for configurable ESP32-C3 smart-home sensor nodes (Embassy); started as a battery bird-feeder scale"
license = "MIT"

[lib]
name = "rs_smarthome_nodes"
path = "src/lib.rs"

[[bin]]
name = "rs-smarthome-nodes"
path = "src/main.rs"
# The firmware itself only exists with the HAL. Declaring that lets a host build
# (`--no-default-features`) skip the binary entirely instead of failing to find
# esp-hal, so `cargo test` and `cargo clippy --all-targets` work on the host.
required-features = ["hal"]

# Everything that talks to a bus, a peripheral or the radio sits behind `hal`,
# which is on by default — a normal `cargo build` is unchanged. Turning it off
# leaves the parts that are pure computation (frame decoding, CRCs, blob
# layouts, discovery payloads, config parsing), and *those* build for the host,
# so they can have real unit tests:
#
#   cargo test --lib --no-default-features --target x86_64-unknown-linux-gnu
#
# See tests/README or `docs/base-platform.md` for the reasoning.
[features]
default = ["hal"]
hal = [
    "dep:esp-hal",
    "dep:esp-hal-embassy",
    "dep:esp-backtrace",
    "dep:esp-println",
    "dep:esp-alloc",
    "dep:esp-wifi",
    "dep:esp-storage",
    "dep:embedded-storage",
    "dep:embassy-net",
    "dep:embassy-executor",
    "dep:embassy-time",
    "dep:embassy-sync",
    "dep:embedded-hal-async",
    "dep:embedded-io-async",
    "dep:rust-mqtt",
    "dep:static_cell",
]

[dependencies]
# --- Portable: needed by the pure logic too, so never optional ---
heapless = "0.8.0"
log = "0.4.22"

# --- ESP32-C3 HAL & async runtime ---
esp-hal = { version = "0.22.0", features = ["esp32c3"], optional = true }
esp-hal-embassy = { version = "0.5.0", features = ["esp32c3"], optional = true }
esp-backtrace = { version = "0.14.2", features = [
    "esp32c3",
    "panic-handler",
    "println",
    "exception-handler",
], optional = true }
esp-println = { version = "0.12.0", features = [
    "esp32c3",
    "log",
], optional = true }
esp-alloc = { version = "0.5.0", optional = true }

# --- Wi-Fi + TCP/IP stack ---
esp-wifi = { version = "0.11.0", features = [
    "esp32c3",
    "wifi",
    "utils",
    "esp-alloc",
], optional = true }
embassy-net = { version = "0.4.0", features = [
    "tcp",
    "udp",
    "dhcpv4",
    "medium-ethernet",
    "dns",
], optional = true }

# --- Embassy core ---
embassy-executor = { version = "0.6.3", features = [
    "task-arena-size-32768",
    "integrated-timers",
], optional = true }
embassy-time = { version = "0.3.2", optional = true }
embassy-sync = { version = "0.6.1", optional = true }

# --- Sensor bus traits (keep the drivers HAL-agnostic) ---
embedded-hal-async = { version = "1.0.0", optional = true }
embedded-io-async = { version = "0.6.1", optional = true }

# --- MQTT & utility ---
rust-mqtt = { version = "=0.3.0", default-features = false, optional = true }
static_cell = { version = "2.1.0", optional = true }

# --- Config persistence (NVS flash) ---
esp-storage = { version = "0.4.0", features = ["esp32c3"], optional = true }
embedded-storage = { version = "0.3", optional = true }

# Host-only, and only for `cargo test`: the discovery payloads are assembled by
# hand into a fixed buffer, so the tests parse them back as real JSON rather
# than pattern-matching strings. Never built for the device.
[target.'cfg(not(target_os = "none"))'.dev-dependencies]
serde_json = "1"

[profile.dev]
# Rust debug builds are far too large/slow to run on-device; always optimise.
opt-level = 3
lto = "off"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
overflow-checks = false
