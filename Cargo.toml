[package]
name = "rs-smarthome-nodes"
version = "0.2.0"
edition = "2021"
authors = ["Jürgen Hahn"]
description = "Async no_std firmware for configurable ESP32-C3 smart-home sensor nodes (Embassy); started as a battery bird-feeder scale"
license = "MIT"

[lib]
name = "rs_smarthome_nodes"
path = "src/lib.rs"

[[bin]]
name = "rs-smarthome-nodes"
path = "src/main.rs"
# The firmware itself only exists with the HAL. Declaring that lets a host build
# (`--no-default-features`) skip the binary entirely instead of failing to find
# esp-hal, so `cargo test` and `cargo clippy --all-targets` work on the host.
required-features = ["hal"]

# Everything that talks to a bus, a peripheral or the radio sits behind `hal`,
# which is on by default — a normal `cargo build` is unchanged. Turning it off
# leaves the parts that are pure computation (frame decoding, CRCs, blob
# layouts, discovery payloads, config parsing), and *those* build for the host,
# so they can have real unit tests:
#
#   cargo test --no-default-features --features host-tests \
#       --target x86_64-unknown-linux-gnu
#
# See `docs/base-platform.md` for the reasoning.
[[example]]
name = "lamp_bench"
# Needs the chip support crates; a host build (`--no-default-features`) has none.
required-features = ["hal"]

[features]
default = ["hal"]

# The bus-generic sensor drivers: they name no esp-hal type, only the
# `embedded-hal-async` / `embedded-io-async` traits and embassy-time. Split out
# of `hal` so the host tests can exercise the *real* drivers against fake buses
# (see `sensors::mock`) without dragging in the chip support crates.
drivers = [
    "dep:embassy-time",
    "dep:embedded-hal",
    "dep:embedded-hal-async",
    "dep:embedded-io-async",
    "dep:gas-index-algorithm",
]

# What the host test run enables. embassy-time needs two things to link that the
# device gets elsewhere: a time driver (`std`, the whole reason the driver tests
# can await a conversion) and a timer queue — on the device that comes from
# embassy-executor's `integrated-timers`, which there is no executor to provide
# here.
host-tests = ["drivers", "embassy-time/std", "embassy-time/generic-queue-16"]

hal = [
    "drivers",
    "dep:esp-hal",
    "dep:esp-hal-embassy",
    "dep:esp-backtrace",
    "dep:esp-println",
    "dep:esp-alloc",
    "dep:esp-wifi",
    "dep:esp-wifi-sys",
    "dep:esp-storage",
    "dep:embedded-storage",
    "dep:embassy-net",
    "dep:embassy-executor",
    "dep:embassy-sync",
    "dep:rust-mqtt",
    "dep:static_cell",
]

[dependencies]
# --- Portable: needed by the pure logic too, so never optional ---
heapless = "0.8.0"
log = "0.4.22"

# --- ESP32-C3 HAL & async runtime ---
esp-hal = { version = "0.22.0", features = ["esp32c3"], optional = true }
esp-hal-embassy = { version = "0.5.0", features = ["esp32c3"], optional = true }
# `custom-halt` is the whole point of this dependency's configuration. Without
# it both handlers end in `halt()` -- `loop { continue; }` -- and a panic or a
# CPU exception parks the board for ever: powered, LED lit, no radio, and no
# watchdog to rescue it, because none is armed either. That is not a theory; it
# is what `bad` did four times in a fortnight and `terrasse` twice before it,
# and it is why `reset_reason` never had anything to report. See `custom_halt`
# in src/main.rs.
esp-backtrace = { version = "0.14.2", features = [
    "esp32c3",
    "panic-handler",
    "println",
    "exception-handler",
    "custom-halt",
], optional = true }
esp-println = { version = "0.12.0", features = [
    "esp32c3",
    "log",
], optional = true }
esp-alloc = { version = "0.5.0", optional = true }

# --- Wi-Fi + TCP/IP stack ---
esp-wifi = { version = "0.11.0", features = [
    "esp32c3",
    "wifi",
    "utils",
    "esp-alloc",
], optional = true }
# The connected AP's RSSI. `esp-wifi` keeps its bindings in a private `binary`
# module and exposes signal strength only through `AccessPointInfo`, i.e. only
# from a scan -- which costs a radio sweep and disturbs the association. The
# same generated bindings are a crate of their own, where
# `esp_wifi_sta_get_ap_info` is public and reads the value the driver already
# holds. Pinned to the version `esp-wifi` itself depends on, so features unify
# and no second copy is built.
esp-wifi-sys = { version = "0.7.1", features = [
    "esp32c3",
], optional = true }
embassy-net = { version = "0.4.0", features = [
    "tcp",
    "udp",
    "dhcpv4",
    "medium-ethernet",
    "dns",
], optional = true }

# --- Embassy core ---
embassy-executor = { version = "0.6.3", features = [
    "task-arena-size-32768",
    "integrated-timers",
], optional = true }
embassy-time = { version = "0.3.2", optional = true }
embassy-sync = { version = "0.6.1", optional = true }

# --- Sensor bus traits (keep the drivers HAL-agnostic) ---
embedded-hal = { version = "1.0.0", optional = true }
embedded-hal-async = { version = "1.0.0", optional = true }

# Sensirion's gas-index algorithm: the SGP41 emits a hotplate resistance, and
# this is what turns it into the 1..500 index Home Assistant should see. An
# unofficial port, BSD-3 like the original, `no_std` and `forbid(unsafe_code)`,
# 470 lines whose whole substance is ~30 tuning constants. Pinned exactly for
# that reason -- a version bump could quietly change any of them, and a wrong
# constant yields a plausible-looking number rather than an error. The
# alternative was transcribing them by hand, which is the same risk without the
# review.
gas-index-algorithm = { version = "=0.1.3", optional = true }
embedded-io-async = { version = "0.6.1", optional = true }

# --- MQTT & utility ---
rust-mqtt = { version = "=0.3.0", default-features = false, optional = true }
static_cell = { version = "2.1.0", optional = true }

# --- Config persistence (NVS flash) ---
esp-storage = { version = "0.4.0", features = ["esp32c3"], optional = true }
embedded-storage = { version = "0.3", optional = true }

# Host-only, and only for `cargo test`: the discovery payloads are assembled by
# hand into a fixed buffer, so the tests parse them back as real JSON rather
# than pattern-matching strings. Never built for the device.
[target.'cfg(not(target_os = "none"))'.dev-dependencies]
serde_json = "1"
# Drives the driver futures in tests. A hand-rolled block_on with a wrong waker
# would show up as a hang rather than a failure, which is not a trade worth
# making to save a dev-dependency.
futures-executor = "0.3"

[profile.dev]
# Rust debug builds are far too large/slow to run on-device; always optimise.
opt-level = 3
lto = "off"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
overflow-checks = false

